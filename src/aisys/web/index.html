<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="aisys-csrf" content="__AISYS_CSRF_TOKEN__" />
  <title>AIsys · Gemini × Codex 双模型协作室</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="topbar-left">
        <div class="brand-mark">A</div>
        <div>
          <div class="brand-title">AIsys 双模型协作室</div>
          <div class="brand-sub">Gemini (Antigravity) × Codex · 独立提案 · 互审进化 · 无重叠协同</div>
        </div>
      </div>

      <div class="topbar-center" id="backend-pills">
        <span class="pill pill-muted">检测模型状态…</span>
      </div>

      <div class="topbar-right">
        <select id="session-select" class="input input-sm" title="切换历史会话">
          <option value="">+ 新建协作会话</option>
        </select>
        <button class="btn btn-secondary btn-sm" id="btn-new-session">+ 新建</button>
        <button class="btn btn-ghost btn-sm" id="btn-theme" title="切换深色/浅色主题">◐</button>
        <button class="btn btn-danger-ghost btn-sm" id="btn-stop-service" title="停止 AIsys 本地服务">⏻ 停止</button>
      </div>
    </header>

    <main class="container">
      <!-- NEW SESSION LAUNCHER -->
      <section class="card hero-card" id="composer-section">
        <div class="hero-head">
          <div>
            <h1>你想让 Gemini 和 Codex 一起完成什么？</h1>
            <p class="muted">先各自独立提案 → 交叉互审并给出无重叠分工 → 你来拍板或融合微调 → 双方按互斥权限协同完成并互相审查。</p>
          </div>
          <div class="mode-switch" role="group" aria-label="协作模式">
            <button class="mode-btn active" data-mode="dev">💻 开发任务</button>
            <button class="mode-btn" data-mode="learn">📚 学习与研究（输出 Markdown 文档）</button>
          </div>
        </div>

        <textarea id="task-input" class="input hero-textarea" rows="4"
          placeholder="例如：帮我深入搞懂 Rust 的所有权、借用检查与生命周期，并给出对比图、可运行代码案例和常见避坑练习…"></textarea>

        <div class="hero-footer">
          <div class="project-row" id="project-row">
            <input type="text" id="project-input" class="input input-sm"
              placeholder="可选：目标 Git 项目绝对路径（仅读取已提交 HEAD 构建隔离副本，不改原仓库）" />
            <button type="button" class="btn btn-secondary btn-sm" id="btn-validate-project">校验目录</button>
            <span id="project-hint" class="muted small"></span>
          </div>
          <button class="btn btn-primary btn-lg" id="btn-create-session">✦ 开始双模型分析</button>
        </div>
      </section>

      <!-- ACTIVE SESSION WORKSPACE -->
      <section id="session-section" class="hidden">
        <!-- Session Title & Actions -->
        <div class="session-header card">
          <div class="session-meta">
            <div class="inline-row">
              <span class="pill" id="s-mode-badge">开发任务</span>
              <span class="pill" id="s-stage-badge">阶段 1</span>
              <span class="mono muted small" id="s-id-label"></span>
            </div>
            <h2 id="s-task-title" class="session-title"></h2>
          </div>
          <div class="inline-row">
            <button class="btn btn-secondary btn-sm" id="btn-trigger-codex" title="触发/重试 Codex 就绪步骤">↻ 运行 Codex</button>
            <button class="btn btn-danger-ghost btn-sm" id="btn-cancel-session">取消会话</button>
          </div>
        </div>

        <!-- 5-Step Progress Stepper -->
        <ol class="stepper" id="stepper">
          <li data-step="1"><span class="step-num">1</span><span>独立初案</span></li>
          <li data-step="2"><span class="step-num">2</span><span>交叉互审与分工</span></li>
          <li data-step="3"><span class="step-num">3</span><span>你的拍板</span></li>
          <li data-step="4"><span class="step-num">4</span><span>互斥协同执行</span></li>
          <li data-step="5"><span class="step-num">5</span><span>互相监督交付</span></li>
        </ol>

        <!-- Error Banner -->
        <div id="s-error-banner" class="banner banner-error hidden"></div>

        <!-- Antigravity Route-1 Guidance Bar (shown when Gemini has pending work) -->
        <div id="gemini-action-bar" class="card action-bar hidden"></div>

        <!-- Dynamic Stage Content -->
        <div id="stage-content" class="stage-content"></div>
      </section>
    </main>
  </div>

  <!-- MODAL -->
  <div class="modal-backdrop hidden" id="modal-backdrop">
    <div class="modal-dialog" role="dialog" aria-modal="true">
      <div class="modal-header">
        <h3 id="modal-title">确认</h3>
        <button class="btn btn-ghost btn-sm" id="modal-close">✕</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer" id="modal-footer"></div>
    </div>
  </div>

  <div class="toast-stack" id="toast-stack"></div>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
