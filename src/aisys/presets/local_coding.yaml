version: 1
name: Codex local coding
start: implement
budget:
  model_calls: 4
agents:
  engineer:
    role: Programmer
    backend: codex
    instructions: Write a small Python module with no third-party dependencies. Respond with a complete replacement of answer.py.
    write_paths: [answer.py]
  reviewer:
    role: Reviewer
    backend: codex
    instructions: Inspect the code and test result against the task. Set decision to pass or fail and explain any finding.
nodes:
  implement:
    kind: agent
    agent: engineer
    files: [answer.py]
    next: syntax
  syntax:
    kind: check
    argv: [python, -c, "from pathlib import Path; compile(Path('answer.py').read_text(), 'answer.py', 'exec'); print('syntax ok')"]
    next: review
  review:
    kind: agent
    agent: reviewer
    files: [answer.py]
    inputs: [implement, syntax]
    next: summary
  summary:
    kind: report
    inputs: [implement, syntax, review]
