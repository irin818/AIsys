version: 1
name: Independent dual-model evaluation
start: compare
agents:
  coder:
    role: Implementation analyst
    backend: codex
    instructions: Independently analyze the task. Explain a viable implementation, acceptance checks, and unknowns.
  architect:
    role: Architecture analyst
    backend: google
    on_unavailable: handoff
    instructions: Independently analyze architecture and alternatives. Explain assumptions and tradeoffs.
  cross_reviewer:
    role: Cross reviewer
    backend: codex
    instructions: Compare both independent analyses. Cite specific claims from each and identify agreements, disagreements, and missing evidence.
nodes:
  compare:
    kind: parallel
    branches: [implementation, architecture]
    next: cross_review
  implementation:
    kind: agent
    agent: coder
    space: implementation
  architecture:
    kind: agent
    agent: architect
    space: architecture
  cross_review:
    kind: agent
    agent: cross_reviewer
    inputs: [implementation, architecture]
    next: report
  report:
    kind: report
    inputs: [implementation, architecture, cross_review]
